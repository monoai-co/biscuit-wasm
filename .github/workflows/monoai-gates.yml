# yaml-language-server: $schema=../../monoai/schemas/github-workflow.schema.json
name: MonoAI gates
on:
  pull_request:
    branches: [monoai]
  push:
    branches: [monoai]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monoai-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: namespace-profile-linux-monoai-small;overrides.cache-tag=monoai-biscuit-wasm-v1
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          persist-credentials: false
      - name: Validate workflow
        run: sh monoai/validate-workflow.sh
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
      - name: Install the other consumer runtime
        run: mise install node@22.23.1
      - name: Mount Cargo cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
      - name: Record build environment
        run: |
          uname -sm
          rustc --version --verbose
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'
          echo "CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset} HOME=$HOME PWD=$PWD"
      - name: Rust checks, reproducible build, JS tests and evaluation limits
        run: bash monoai/gates.sh
      - name: Upload the rebuilt module when it differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-module
          path: module/
          if-no-files-found: ignore
          retention-days: 7
